name: Claravine

image: https://www.claravine.com/og/index.png

description: Claravine provides a Data Standards Platform that helps enterprises govern taxonomy and naming standards across marketing campaigns,
  content, and data pipelines. Their SaaS solution integrates with major ad platforms, CRM, and analytics tools, offering APIs for submitting
  and reading standardized data, security features like SOC 2 Type II, SSO, and RBAC, and tools for AI‑assisted taxonomy management. The company
  serves agencies, retailers, CPG, healthcare, automotive, and other industries, emphasizing data consistency at scale.

